<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Zoomcut</title>

</head>
<body data-view="home">

  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></symbol>

<header class="top">
  <button class="brand" id="goHome" type="button" data-tip="Home">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="zg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6c63ff"/><stop offset="1" stop-color="#968cf0"/></linearGradient></defs>
      <rect x="9" y="9" width="82" height="82" rx="23" fill="none" stroke="url(#zg)" stroke-width="8.5"/>
      <rect x="28.5" y="28.5" width="43" height="43" rx="10.5" fill="url(#zg)" stroke="#0a0b0f" stroke-width="7"/>
    </svg>
    <span>Zoomcut</span>
  </button>
  <div class="crumb" id="crumb" hidden>
    <svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg>
    <span class="pname" id="pName"></span>
    <span class="pmeta" id="pMeta"></span>
  </div>
  <div class="grow"></div>
  <button class="status" id="statusBtn" type="button"><i class="dot"></i><span id="statusText">Connecting…</span></button>
  <div class="top-actions editor-only" hidden>
    <button class="ib" id="btnKeys" type="button" data-tip="Keyboard shortcuts" data-kbd="?"><svg class="ic" aria-hidden="true"><use href="#i-keyboard"/></svg></button>
    <button class="btn" id="btnSave" type="button" data-tip="Save the project file" data-kbd="Mod+S"><svg class="ic" aria-hidden="true"><use href="#i-save"/></svg><span>Save</span></button>
    <button class="btn primary export-btn" id="btnExport" type="button" data-tip="Export the video" data-kbd="Mod+E"><svg class="ic" aria-hidden="true"><use href="#i-export"/></svg><span>Export</span></button>
  </div>
</header>

<main class="home" id="home"></main>

<main class="editor" id="editor" hidden>
  <section class="viewer">
    <div class="stage-wrap" id="stageWrap">
      <div class="frame" id="frame">
        <div class="bg" aria-hidden="true">
          <div class="bg-fill" id="bgFill"></div>
          <div class="bg-img" id="bgImg" hidden></div>
          <canvas class="bg-grad" id="bgGrad" hidden></canvas>
          <div class="bg-dim" id="bgDim"></div>
        </div>
        <div class="win" id="win">
          <video id="vid" muted playsinline preload="auto" disablepictureinpicture></video>
          <div class="win-edge" id="winEdge"></div>
        </div>
        <img class="exact" id="exact" alt="" hidden>
        <div class="badges">
          <span class="badge" id="badgeExact" hidden><svg class="ic" aria-hidden="true"><use href="#i-hd"/></svg>Exact render</span>
          <span class="badge warn" id="badgeTrim" hidden><svg class="ic" aria-hidden="true"><use href="#i-scissors"/></svg>Trimmed out · not exported</span>
        </div>
        <div class="reframe-hint" id="reframeHint" hidden>Drag to reframe · scroll to zoom</div>
        <div class="buffer"><i class="spin"></i></div>
      </div>
      <div class="stage-status" id="stageStatus" hidden></div>
    </div>
    <div class="transport">
      <div class="tp-time"><span id="tCur">0:00.00</span><span class="tp-sep">/</span><span id="tDur">0:00.00</span></div>
      <div class="tp-mid">
        <button class="ib" id="tpStart" type="button" data-tip="Go to start" data-kbd="Home"><svg class="ic" aria-hidden="true"><use href="#i-skip-start"/></svg></button>
        <button class="ib" id="tpBack" type="button" data-tip="Back one frame" data-kbd="←"><svg class="ic" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
        <button class="play" id="tpPlay" type="button" data-tip="Play" data-kbd="Space" aria-label="Play or pause"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button>
        <button class="ib" id="tpFwd" type="button" data-tip="Forward one frame" data-kbd="→"><svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
        <button class="ib" id="tpEnd" type="button" data-tip="Go to end" data-kbd="End"><svg class="ic" aria-hidden="true"><use href="#i-skip-end"/></svg></button>
      </div>
      <div class="tp-right">
        <button class="ib tog" id="tpLoop" type="button" data-tip="Loop playback" data-kbd="L" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-repeat"/></svg></button>
        <button class="speed" id="tpSpeed" type="button" data-tip="Playback speed">1×</button>
        <button class="ib" id="tpExact" type="button" data-tip="Render this exact frame" data-kbd="F"><svg class="ic" aria-hidden="true"><use href="#i-hd"/></svg></button>
        <button class="ib" id="tpFull" type="button" data-tip="Full-screen preview"><svg class="ic" aria-hidden="true"><use href="#i-expand"/></svg></button>
      </div>
    </div>
  </section>

  <aside class="inspector" id="inspector">
    <nav class="tabs" role="tablist" aria-label="Inspector">
      <button type="button" role="tab" data-tab="zoom" id="tab-zoom" aria-controls="paneZoom"><svg class="ic" aria-hidden="true"><use href="#i-zoom-in"/></svg><span>Zoom</span></button>
      <button type="button" role="tab" data-tab="background" id="tab-background" aria-controls="paneBg"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg><span>Background</span></button>
      <button type="button" role="tab" data-tab="frame" id="tab-frame" aria-controls="paneFrame"><svg class="ic" aria-hidden="true"><use href="#i-frame"/></svg><span>Frame</span></button>
      <button type="button" role="tab" data-tab="motion" id="tab-motion" aria-controls="paneMotion"><svg class="ic" aria-hidden="true"><use href="#i-motion"/></svg><span>Motion</span></button>
    </nav>
    <div class="panes">
      <div class="pane" data-pane="zoom" id="paneZoom" role="tabpanel" aria-labelledby="tab-zoom"></div>
      <div class="pane" data-pane="background" id="paneBg" role="tabpanel" aria-labelledby="tab-background" hidden></div>
      <div class="pane" data-pane="frame" id="paneFrame" role="tabpanel" aria-labelledby="tab-frame" hidden></div>
      <div class="pane" data-pane="motion" id="paneMotion" role="tabpanel" aria-labelledby="tab-motion" hidden></div>
    </div>
  </aside>

  <section class="timeline" id="timeline" aria-label="Timeline">
    <div class="tl-bar">
      <div class="tl-group">
        <button class="ib" id="tbUndo" type="button" data-tip="Undo" data-kbd="Mod+Z" disabled><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg></button>
        <button class="ib" id="tbRedo" type="button" data-tip="Redo" data-kbd="Shift+Mod+Z" disabled><svg class="ic" aria-hidden="true"><use href="#i-redo"/></svg></button>
      </div>
      <span class="tl-sep"></span>
      <div class="tl-group">
        <button class="tb" id="tbAdd" type="button" data-tip="Add a zoom at the playhead" data-kbd="Z"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>Zoom</span></button>
        <button class="ib" id="tbSplit" type="button" data-tip="Split the zoom at the playhead" data-kbd="S"><svg class="ic" aria-hidden="true"><use href="#i-scissors"/></svg></button>
        <button class="ib" id="tbDel" type="button" data-tip="Delete the selected zoom" data-kbd="⌫" disabled><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg></button>
      </div>
      <span class="tl-sep"></span>
      <button class="ib tog" id="tbSnap" type="button" data-tip="Snap to edges, cuts and the playhead" data-kbd="N"><svg class="ic" aria-hidden="true"><use href="#i-magnet"/></svg></button>
      <span class="tl-info" id="tlInfo"></span>
      <div class="grow"></div>
      <div class="tl-zoom">
        <button class="ib" id="tbZoomOut" type="button" data-tip="Zoom the timeline out" data-kbd="−"><svg class="ic" aria-hidden="true"><use href="#i-zoom-out"/></svg></button>
        <input type="range" id="tbZoom" min="0" max="100" step="0.1" value="0" aria-label="Timeline zoom">
        <button class="ib" id="tbZoomIn" type="button" data-tip="Zoom the timeline in" data-kbd="="><svg class="ic" aria-hidden="true"><use href="#i-zoom-in"/></svg></button>
        <button class="ib" id="tbFit" type="button" data-tip="Fit the whole clip" data-kbd="0"><svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>
    </div>
    <div class="tl-body">
      <div class="tl-heads" aria-hidden="true">
        <div class="tl-head ruler-h"></div>
        <div class="tl-head clip-h"><svg class="ic"><use href="#i-film"/></svg><span>Clip</span></div>
        <div class="tl-head zoom-h"><svg class="ic"><use href="#i-zoom-in"/></svg><span>Zoom</span></div>
        <div class="tl-head act-h"><svg class="ic"><use href="#i-activity"/></svg><span>Activity</span></div>
      </div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-content" id="tlContent">
          <div class="lane ruler" id="laneRuler"><canvas id="cvRuler"></canvas></div>
          <div class="lane clip" id="laneClip"><canvas id="cvStrip"></canvas></div>
          <div class="lane zoom" id="laneZoom">
            <div class="tl-ghost" id="ghost" hidden><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>Add zoom</span></div>
          </div>
          <div class="lane act" id="laneAct"><canvas id="cvAct"></canvas></div>
          <div class="cuts" id="cutsLayer"></div>
          <div class="trim-shade" id="shadeL"></div>
          <div class="trim-shade" id="shadeR"></div>
          <div class="trim-h l" id="trimL" data-tip="Drag to trim the start · double-click to reset" data-kbd="I"></div>
          <div class="trim-h r" id="trimR" data-tip="Drag to trim the end · double-click to reset" data-kbd="O"></div>
          <div class="snapline" id="snapLine" hidden></div>
          <div class="hoverline" id="hoverLine" hidden><span></span></div>
          <div class="playhead" id="playhead"><div class="ph-knob" data-tip="Drag to scrub"></div></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="overlays">
  <div class="drop-veil" id="dropVeil"><div><svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg><b>Drop to open</b><span>A recording to edit, or an image to use as the background</span></div></div>
</div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
</body>
</html>

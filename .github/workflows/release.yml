name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  # The apps are named from pyproject.toml and the release notes link to them
  # by the tag, so the two must agree - checked before anything is built.
  version:
    name: the tag is the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PY=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)
          PKG=$(sed -n 's/^__version__ *= *"\(.*\)"/\1/p' zoomcut/__init__.py | head -1)
          echo "tag $TAG, pyproject.toml $PY, zoomcut/__init__.py $PKG"
          if [ "$TAG" != "v$PY" ] || [ "$PY" != "$PKG" ]; then
            echo "::error::the tag is $TAG, but pyproject.toml says $PY and zoomcut/__init__.py says $PKG - bump both to match before tagging"
            exit 1
          fi

  # the same build every push runs, end-to-end test included
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 30
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  wheel:
    name: build · wheel + sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  release:
    name: publish release
    needs: [build, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p upload
          # the apps, the command-line builds, the Python package, and the
          # exact ffmpeg source the apps carry (GPL)
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.whl' \
            -o -name 'ffmpeg-*.tar.xz' \) -exec cp {} upload/ \;
          ls -la upload
      - name: Release notes
        env:
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          V="${TAG#v}"
          D="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          ## Download

          | | |
          |---|---|
          | **macOS** (Apple Silicon) | [Zoomcut-$V-mac-arm64.dmg]($D/Zoomcut-$V-mac-arm64.dmg) |
          | **Windows** (x64) | [Zoomcut-$V-win-x64.exe]($D/Zoomcut-$V-win-x64.exe) |
          | **Linux** (x64) | [AppImage]($D/Zoomcut-$V-linux-x86_64.AppImage) · [.deb]($D/Zoomcut-$V-linux-amd64.deb) |

          The apps include everything they need, ffmpeg too. The \`zoomcut-*\` archives are
          the command-line build; \`pip install zoomcut\` works everywhere, Intel Macs included.

          The apps carry ffmpeg, which is GPL; its exact source is attached as \`ffmpeg-*.tar.xz\`.
          EOF
          if [ "$SIGNED" != "true" ]; then
            printf '\n%s\n' "These builds are not signed by Apple or Microsoft: the first time, open the Mac app from System Settings › Privacy & Security › **Open Anyway**, and on Windows choose **More info › Run anyway**." >> notes.md
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.tag }}"; fi
          gh release create "$TAG" upload/* \
            --title "Zoomcut $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag || gh release upload "$TAG" upload/* --clobber

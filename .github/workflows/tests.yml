name: tests

on:
  push:
    # ci/* branches prove a change on every platform before it reaches main
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # the downloadable apps: built, then driven end to end on each platform
  app:
    uses: ./.github/workflows/build.yml

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: "macOS",   python: "3.12" }
          - { os: windows-latest, name: "Windows", python: "3.12" }
          - { os: ubuntu-latest,  name: "Linux",   python: "3.12" }
          - { os: ubuntu-latest,  name: "Linux · python 3.10", python: "3.10" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install ffmpeg and an X server (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb wmctrl xdotool x11-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow

      # --quick skips the checks that need a logged-in desktop session
      # (wallpaper catalogue, window list, screen-recording permission).
      - name: Test suite
        run: python tests/test_all.py --quick

      # Capture exercised for real: record a region, auto-cut it, render it.
      # Linux grabs a virtual X display, Windows grabs the runner's desktop.
      - name: Record → auto-cut → render (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" python -m zoomcut record \
            --mode region --region 0,0,640,480 --seconds 3 -o /tmp/cap.mkv
          python -m zoomcut auto /tmp/cap.mkv -o /tmp/out.mp4 --preview --size 1080p
          # --preview renders a 1280-wide draft regardless of --size
          python -c "from zoomcut.util import probe; i = probe('/tmp/out.mp4'); print(i); assert i['duration'] > 1.0 and i['width'] == 1280, i"

      - name: Record → auto-cut → render (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          python -m zoomcut record --mode region --region 0,0,640,480 --seconds 3 -o cap.mkv
          python -m zoomcut auto cap.mkv -o out.mp4 --preview --size 1080p
          test -s out.mp4
          python -c "from zoomcut.util import probe; i=probe('out.mp4'); print(i); assert i['duration']>1.0 and i['width']==1280, i"

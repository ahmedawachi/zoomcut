[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomcut"
version = "1.0.0"
description = "Record your Mac screen and get a finished, edited-looking video with automatic camera moves."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Awachi" }]
keywords = ["screen-recording", "screencast", "video", "macos", "demo", "ffmpeg"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/ahmedawachi/zoomcut"
Issues = "https://github.com/ahmedawachi/zoomcut/issues"

[project.scripts]
zoomcut = "zoomcut.cli:main"

[tool.setuptools]
packages = ["zoomcut"]

[tool.setuptools.package-data]
zoomcut = ["web/*.html"]
